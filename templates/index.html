<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartYes - Attendance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<datalist id="classOptions">
    <option value="FY AIML A">
    <option value="FY AIML B">
    <option value="FY EC">
    <option value="FY Com">
    <option value="FY IT">
    <option value="SY AIML">
    <option value="SY EC">
    <option value="SY Com">
    <option value="SY IT">
    <option value="TY AIML">
    <option value="TY EC">
    <option value="TY Com">
    <option value="TY IT">
</datalist>

<datalist id="subjectOptions">
    <option value="Machine Learning (ML)">
    <option value="Theory of Computation (TOC)">
    <option value="Operating Systems (OS)">
    <option value="Database Management Systems (DBMS)">
    <option value="Compiler Design (CD)">
    <option value="Computer Networks (CN)">
    <option value="Computer Graphics (CG)">
    <option value="Java Programming (JP)">
    <option value="Cloud & Distributed AI Systems (CDAI)">
    <option value="Data Engineering & Big Data Systems (DEBD)">
    <option value="Data Science & Visualization (DSV)">
    <option value="Human Computer Interaction (HCI)">
    <option value="Electronic Product Development (EPD)">
    <option value="Program Elective – I (PE-I)">
    <option value="Open Elective (OE)">
    <option value="MDM – Embedded Systems (ES)">
    <option value="MDM – Machine Learning (ML)">
    <option value="Embedded Systems (ES)">
    <option value="ML Lab">
    <option value="OS Lab">
    <option value="DBMS Lab">
    <option value="CN Lab">
    <option value="ES Lab">
    <option value="EPD Lab">
    <option value="MLOPs Lab">
</datalist>

<div class="container my-5">
    <h2 class="text-center text-primary fw-bold mb-4">SmartYes - Attendance Portal</h2>

    <!-- 1. Teacher Panel -->
    <div class="card shadow p-4 mb-4 border-0 rounded-3">
        <h4 class="card-title text-primary mb-3">1. Teacher Panel - Generate Code</h4>
        <form id="generateCodeForm">
            <input type="hidden" name="latitude" id="teacherLat">
            <input type="hidden" name="longitude" id="teacherLon">

            <div class="mb-3">
                <label class="form-label fw-bold">Teacher Password:</label>
                <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Select Class:</label>
                <input class="form-control" list="classOptions" name="selected_class" placeholder="Type to search Class..." required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Select Subject:</label>
                <input class="form-control" list="subjectOptions" name="subject" placeholder="Type to search Subject..." required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Generate Attendance Code</button>
        </form>

        <div id="codeDisplay" class="alert alert-success mt-4 text-center d-none" role="alert">
            <h5 class="mb-1">Active Attendance Code</h5>
            <h1 class="display-2 fw-bold text-success my-2" id="generatedCode">---</h1>
            <p class="mb-2 fs-5" id="codeDetails"></p>
            <button onclick="clearActiveCode()" class="btn btn-outline-danger btn-sm">Clear / Reset Code</button>
        </div>
    </div>

    <!-- 2. Student Panel -->
    <div class="card shadow p-4 mb-4 border-0 rounded-3">
        <h4 class="card-title text-success mb-3">2. Student Panel - Mark Attendance</h4>
        <form id="markAttendanceForm">
            <input type="hidden" name="latitude" id="studentLat">
            <input type="hidden" name="longitude" id="studentLon">

            <div class="mb-3">
                <label class="form-label">Roll Number:</label>
                <input type="text" name="roll_no" class="form-control" placeholder="Enter Roll No" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Student Name:</label>
                <input type="text" name="student_name" class="form-control" placeholder="Enter Full Name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">3-Digit Attendance Code:</label>
                <input type="text" name="code" class="form-control" placeholder="Enter Code Shared by Teacher" required>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100">Submit Attendance</button>
        </form>
    </div>

    <!-- 3. Live View Attendance Records (No Password Required) -->
    <div class="card shadow p-4 border-0 rounded-3">
        <h4 class="card-title text-dark mb-3">3. View Attendance Records (Live)</h4>
        
        <form id="filterForm" class="mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Filter Date:</label>
                    <input type="date" id="filter_date" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Filter Class:</label>
                    <input class="form-control" list="classOptions" id="filter_class" placeholder="Search Class...">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Filter Subject:</label>
                    <input class="form-control" list="subjectOptions" id="filter_subject" placeholder="Search Subject...">
                </div>
            </div>
            <button type="button" onclick="fetchRecords()" class="btn btn-dark w-100 mt-3">Apply Filter</button>
        </form>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="alert alert-info mb-0 py-2 px-3 fw-bold">
                📊 Total Present Students: <span class="badge bg-primary fs-6" id="totalPresent">0</span>
            </div>

            <form action="/download_excel" method="POST" id="exportForm" class="mb-0">
                <input type="hidden" name="filter_date" id="exp_filter_date">
                <input type="hidden" name="filter_class" id="exp_filter_class">
                <input type="hidden" name="filter_subject" id="exp_filter_subject">
                <button type="submit" class="btn btn-success">Export CSV / Excel Sheet</button>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-bordered mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Roll No ⬇️</th>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Subject</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <tr>
                        <td colspan="5" class="text-center py-3 text-muted">Loading live attendance records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
function getLocation(latInputId, lonInputId, callback) {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById(latInputId).value = position.coords.latitude;
                document.getElementById(lonInputId).value = position.coords.longitude;
                if(callback) callback(true);
            },
            (error) => {
                alert("Please enable GPS/Location permission in your browser!");
                if(callback) callback(false);
            },
            { enableHighAccuracy: true }
        );
    } else {
        alert("Geolocation is not supported by your browser.");
        if(callback) callback(false);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    getLocation('teacherLat', 'teacherLon');
    getLocation('studentLat', 'studentLon');

    const savedCode = localStorage.getItem("activeCode");
    const savedClass = localStorage.getItem("activeClass");
    const savedSubject = localStorage.getItem("activeSubject");

    if (savedCode) {
        showCodeUI(savedCode, savedClass, savedSubject);
    }

    fetchRecords();
    setInterval(fetchRecords, 3000); // Live Auto Refresh every 3 seconds
});

function showCodeUI(code, className, subject) {
    document.getElementById('generatedCode').innerText = code;
    document.getElementById('codeDetails').innerText = `Class: ${className} | Subject: ${subject}`;
    document.getElementById('codeDisplay').classList.remove('d-none');

    document.getElementById('filter_class').value = className;
    document.getElementById('filter_subject').value = subject;
    fetchRecords();
}

function clearActiveCode() {
    localStorage.removeItem("activeCode");
    localStorage.removeItem("activeClass");
    localStorage.removeItem("activeSubject");
    document.getElementById('codeDisplay').classList.add('d-none');
}

async function fetchRecords() {
    const fDate = document.getElementById('filter_date').value;
    const fClass = document.getElementById('filter_class').value;
    const fSub = document.getElementById('filter_subject').value;

    document.getElementById('exp_filter_date').value = fDate;
    document.getElementById('exp_filter_class').value = fClass;
    document.getElementById('exp_filter_subject').value = fSub;

    const queryParams = new URLSearchParams({
        filter_date: fDate,
        filter_class: fClass,
        filter_subject: fSub
    });

    try {
        const response = await fetch(`/get_live_records?${queryParams.toString()}`);
        const result = await response.json();

        if (result.status === 'success') {
            const tbody = document.getElementById('recordsTableBody');
            document.getElementById('totalPresent').innerText = result.records.length;

            if (result.records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-muted">No records found.</td></tr>';
            } else {
                let html = '';
                result.records.forEach(row => {
                    html += `<tr>
                        <td class="fw-bold">${row.roll_no}</td>
                        <td>${row.student_name}</td>
                        <td>${row.student_class}</td>
                        <td>${row.subject}</td>
                        <td>${row.timestamp}</td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            }
        }
    } catch(err) {
        console.error("Record fetch error:", err);
    }
}

document.getElementById('generateCodeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = this;
    
    getLocation('teacherLat', 'teacherLon', async function(success) {
        if(!success) return;
        
        const formData = new FormData(form);
        const response = await fetch('/generate_code', { method: 'POST', body: formData });
        const result = await response.json();
        
        if (result.status === 'success') {
            localStorage.setItem("activeCode", result.code);
            localStorage.setItem("activeClass", result.class);
            localStorage.setItem("activeSubject", result.subject);

            showCodeUI(result.code, result.class, result.subject);
        } else {
            alert(result.message || 'Incorrect Teacher Password!');
        }
    });
});

document.getElementById('markAttendanceForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const form = this;

    // Device lock check (1 Mobile = 1 Student)
    if (localStorage.getItem("attendanceMarkedToday") === "true") {
        alert("Attendance already submitted from this device!");
        return;
    }

    getLocation('studentLat', 'studentLon', async function(success) {
        if(!success) return;

        const formData = new FormData(form);
        const response = await fetch('/mark_attendance', { method: 'POST', body: formData });
        const result = await response.json();
        
        alert(result.message); // Displays "Attendance lag gayi!"
        if(result.status === 'success') {
            localStorage.setItem("attendanceMarkedToday", "true");
            form.reset();
            fetchRecords();
        }
    });
});
</script>

</body>
</html>
