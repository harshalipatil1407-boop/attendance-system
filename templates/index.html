<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e0e0; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #3498db; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button.submit-btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button.submit-btn:hover { background: #27ae60; }
        #messageBox { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="card">
    <h2>Smart Attendance Portal</h2>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('student')">Student Portal</button>
        <button class="tab-btn" onclick="switchTab('teacher')">Teacher Portal</button>
    </div>

    <!-- Student Form -->
    <form id="studentForm">
        <div class="form-group">
            <label>Class</label>
            <select name="class_name" required>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>
        </div>
        <div class="form-group">
            <label>Division</label>
            <select name="division" required>
                <option value="Division A">Division A</option>
                <option value="Division B">Division B</option>
            </select>
        </div>
        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" name="roll_no" placeholder="e.g. 101" required>
        </div>
        <div class="form-group">
            <label>3-Digit Class Code</label>
            <input type="text" name="code" placeholder="e.g. 572" required>
        </div>
        <button type="submit" class="submit-btn">Mark Present</button>
    </form>

    <!-- Teacher Form -->
    <form id="teacherForm" style="display: none;">
        <div class="form-group">
            <label>Class</label>
            <select name="class_name" required>
                <option value="Class 11">Class 11</option>
                <option value="Class 12">Class 12</option>
            </select>
        </div>
        <div class="form-group">
            <label>Division</label>
            <select name="division" required>
                <option value="Division A">Division A</option>
                <option value="Division B">Division B</option>
            </select>
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" value="Maths" required>
        </div>
        <div class="form-group">
            <label>Period</label>
            <input type="text" name="period" value="1st Period" required>
        </div>
        <button type="submit" class="submit-btn" style="background:#3498db;">Generate Code</button>
    </form>

    <div id="messageBox"></div>
</div>

<script>
    function switchTab(tab) {
        const studentForm = document.getElementById('studentForm');
        const teacherForm = document.getElementById('teacherForm');
        const btns = document.querySelectorAll('.tab-btn');
        const msg = document.getElementById('messageBox');
        msg.style.display = 'none';

        if(tab === 'student') {
            studentForm.style.display = 'block';
            teacherForm.style.display = 'none';
            btns[0].classList.add('active');
            btns[1].classList.remove('active');
        } else {
            studentForm.style.display = 'none';
            teacherForm.style.display = 'block';
            btns[1].classList.add('active');
            btns[0].classList.remove('active');
        }
    }

    function showMessage(text, isSuccess) {
        const msg = document.getElementById('messageBox');
        msg.innerText = text;
        msg.className = isSuccess ? 'success' : 'error';
        msg.style.display = 'block';
    }

    // Teacher Form Submit
    document.getElementById('teacherForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        try {
            const res = await fetch('/generate_code', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.status === 'Success') {
                showMessage('CODE GENERATED: ' + data.code, true);
            } else {
                showMessage(data.reason || 'Failed to generate code', false);
            }
        } catch(err) {
            showMessage('Server Error: ' + err, false);
        }
    });

    // Student Form Submit
    document.getElementById('studentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        try {
            const res = await fetch('/mark_attendance', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.status === 'Success') {
                showMessage(data.message, true);
            } else {
                showMessage(data.reason || 'Attendance Failed!', false);
            }
        } catch(err) {
            showMessage('Server Error: ' + err, false);
        }
    });
</script>

</body>
</html>
